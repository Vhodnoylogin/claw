name: Publish accepted CLAW 0.9.0 once

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: claw-nexus-090-once
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.repository == 'Vhodnoylogin/claw' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify and publish the already accepted package
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_UPLOAD_ONCE }}
        run: >-
          python3 src/main/python/publication/run_nexus_upload_once.py
          --pin src/main/resources/publication/nexus/0.9.0/verified-package.json
          --reviewed-pin-sha256 42c0c2a46d6fd29d6446f772dac9c342e8e453194407985b2234b7b478494a69
          --apply
      - name: Retain sanitized one-use receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claw-nexus-090-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/run-intent.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/run-summary.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/attempt/upload-intent.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/attempt/*.intent.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/attempt/*.receipt.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/attempt/uncertain-stop.json
            ${{ runner.temp }}/claw-nexus-090-${{ github.run_id }}/attempt/upload-result.json
